[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-proxy"
version = "0.1.0"
description = "State-of-charge proxy for time-series aggregation in energy system models"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_proxy"]