# Paper experiment batch: combined 2- and 5-year horizon sensitivity
#
# Design:
#   TSA method: kmeans + medoid
#   Proxy weights: WP = 0, 0.5
#   Representative-period counts: k = 10, 20, 30, 40, 50, 60, 90, 180
#   2-year horizons: 2006-07, 2008-09, 2010-11, 2012-13, 2014-15,
#                    2016-17, 2018-19, 2020-21, 2022-23
#   5-year horizons: 2006-10, 2008-12, 2011-15, 2013-17, 2016-20, 2018-22
#
# Horizons are restricted to ranges with matching reference models for both
# NL and BE, so the country comparison uses the same weather windows.
#
# Cases: 144 two-year + 96 five-year = 240 total.
#
defaults:
  dispatch_mode: tsa
  data_params:
    country: NL
    start_date: 2010-01-01
    end_date: 2020-01-01
  soc_proxy_params:
    demand_field: demand_power
    renewables:
      solar:
        weight: 0.56
        annualised_capacity_cost: 0.069366234867
        variable_cost: 0.0
      onshore_wind:
        weight: 0.2
        annualised_capacity_cost: 0.136565982927
        variable_cost: 2.0e-06
      offshore_wind:
        weight: 0.24
        annualised_capacity_cost: 0.279506201625
        variable_cost: 5.0e-06
    storage:
      charging_efficiency: 0.6435
      discharging_efficiency: 0.5544
      annualised_energy_capacity_cost: 0.00031902315
      annualised_charge_power_cost: 0.101531096308
      annualised_discharge_power_cost: 0.13427331557
      charge_variable_cost: 0.0
      discharge_variable_cost: 6.8964714e-05
    soc_decomposition:
      method: gaussian
      time_horizon_hours: 24
    margin_mode: auto
  tsa_params:
    k_periods: 40
    period_duration: 1D
    preserve_column_means: true
    soc_proxy:
      enabled: true
      lambda_soc: 0.5
      proxy_field_name: surplus_LDES
    cluster:
      method: kmeans
      random_state: 42
    representation:
      method: medoid
  calliope_params: {}
  solver_params:
    solver: gurobi
    solver_options:
      NumericFocus: 2
  output_params:
    save_capacities: true
    save_costs: true
    save_metrics: true
