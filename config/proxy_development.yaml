defaults:
  dispatch_mode: tsa

  data_params:
    country: NL
    start_date: 2010-01-01
    end_date: 2020-01-01

  soc_proxy_params:
    # NL brownfield capacities, end 2025, CBS
    renewables_fields_and_weights:
      solar: 26.04 
      onshore_wind: 7.05 
      offshore_wind: 4.75 

    soc_decomposition:
      method: gaussian
      time_horizon_hours: 24

    margin_mode: fixed
    margin_value: 0.0

  tsa_params:
    k_periods: 30
    period_duration: 1D
    preserve_column_means: true

    soc_proxy:
      enabled: true
      lambda_soc: 0.5
      proxy_field_name: surplus_LDES

    cluster:
      method: hierarchical
      random_state: 42

    representation:
      method: medoid

  calliope_params:
    scenario: standard

  solver_params:
    solver: gurobi

  output_params:
    save_capacities: true
    save_costs: true
    save_metrics: true


