# Paper experiment batch: 10-year TSA sensitivity
#
# Design:
#   5 overlapping 10-year weather horizons
#   8 representative-period counts: k = 10, 20, 30, 40, 50, 60, 90, 180
#   5 proxy weights: WP = 0, 0.25, 0.5, 0.75, 1
#   TSA method fixed in defaults: hierarchical + medoid
#
# Total: 200 cases.

defaults:
  dispatch_mode: tsa

  data_params:
    country: BE
    start_date: 2010-01-01
    end_date: 2020-01-01

  soc_proxy_params:
    demand_field: demand_power

    renewables:
      solar:
        weight: 0.51
        annualised_capacity_cost: 0.069366234867
        variable_cost: 0.0

      onshore_wind:
        weight: 0.24
        annualised_capacity_cost: 0.136565982927
        variable_cost: 0.000002

      offshore_wind:
        weight: 0.25
        annualised_capacity_cost: 0.279506201625
        variable_cost: 0.000005

    storage:
      charging_efficiency: 0.6435
      discharging_efficiency: 0.5544
      annualised_energy_capacity_cost: 0.000319023150
      annualised_charge_power_cost: 0.101531096308
      annualised_discharge_power_cost: 0.134273315570
      charge_variable_cost: 0.0
      discharge_variable_cost: 0.000068964714

    soc_decomposition:
      method: gaussian
      time_horizon_hours: 24

    margin_mode: auto

  tsa_params:
    k_periods: 40
    period_duration: 1D
    preserve_column_means: true

    soc_proxy:
      enabled: true
      lambda_soc: 0.5
      proxy_field_name: surplus_LDES

    cluster:
      method: hierarchical
      random_state: 42

    representation:
      method: medoid

  calliope_params: {}

  solver_params:
    solver: gurobi
    solver_options:
      NumericFocus: 2

  output_params:
    save_capacities: true
    save_costs: true
    save_metrics: true

