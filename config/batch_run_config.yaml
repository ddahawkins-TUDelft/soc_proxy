endo_test:
  Medoid, k=30, Endogenous Correction, L=0/0:
    dispatch_mode: 'cluster_with_optimisation'
    calliope_params:
    soc_proxy_params:
    tsa_params:
      k_periods: 30
      # k_periods_optimisation: 30
      resample_to_daily_resolution: True
      distance_matrix_metric: 'euclidean'
      mipgap: 0.01
      timelimit: 1200
      lambda_soc: 
        cluster: 0.000001
        optimisation: 0.000001
      soc_proxy: 
          use_soc_proxy: True
          proxy_inputs_to_consider: ['surplus_LDES'] 
          proxy_window: None
          optimisation_proxy_mode: endogenous
      post_cluster_optimisation_params:
        objective:
          - polarity: minimise
            target: soc_proxy_ldes
            weight: 1
            mode: match
